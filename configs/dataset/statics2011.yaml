dataset_name: statics2011
# CMU Open Learning Initiative, Engineering Statics, Fall 2011 -- the dataset the
# KT literature calls STATICS2011. Obtained as OLI_data.zip from
# base.ustc.edu.cn/data/ (EduData names the same archive OLI-Fall-2011); there is
# no statics2011.zip anywhere.
#
# The raw file must live inside dpath: process_raw_data derives its output
# directory from the input path, so pointing raw_path at the extracted archive
# writes every generated file there instead, and split_datasets then rewrites
# dpath in data_config.json to match.
#
# The archive holds three DataShop exports. This is the *step rollup*, which is
# the one preprocess/statics2011_preprocess.py was written against: comma
# separated, `First Attempt` holding correct/incorrect/hint, timestamps like
# 2011/9/21 17:35. The transaction and problem exports have different shapes and
# will not work here.
raw_path: data/statics2011/AllData_student_step_2011F.csv
dpath: data/statics2011
configf: configs/data_config.json

min_seq_len: 3
maxlen: 200
kfold: 5
folds: [0,1,2,3,4]
emb_path: ""

train_valid_original_file: train_valid.csv
train_valid_file: train_valid_sequences.csv
test_original_file: test.csv
test_file: test_sequences.csv
test_window_file: test_window_sequences.csv

# No question level. The preprocessor builds a "concept" by joining
# `Problem Name----Step Name`, so every step is its own unit and there is no
# separate question id -- data_config records num_q = 0 and input_type
# ["concepts"] to match. Asking for quelevel files here would produce nothing
# and leave the config promising files that cannot exist.
gen_question_level: false
