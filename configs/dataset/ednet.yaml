dataset_name: ednet
# ednet is a slice of EdNet-KT1, not a dataset of its own. One shuffle of the user
# ids under seed 2 produces both: `ednet` takes the first 5,000 users found,
# `ednet5w` skips those same 5,000 and takes the next 50,000. Same seed, so the
# two are disjoint and reproducible, and neither is the full release -- KT1 holds
# 784,309 users. See SAMPLING in preprocess/ednet_preprocess.py; data_config.json
# records the plan per dataset so the distinction reaches the artifacts.
#
# raw_path points at the shared KT1 tree, which both slices read. Output goes to
# data/ednet/, since the preprocessor rewrites the path itself.
# Requires data/ednet/contents/questions.csv, which carries the concepts (tags)
# and the answer key; KT1 alone has neither. EdNet-Contents.zip, 174 KB, from
# http://base.ustc.edu.cn/data/EdNet/
#
# data/ednet/KT1/ was deleted on 2026-09-18 once the sequences were built: 2.9 GB
# across 784,309 per-user files, none of which the training path reads, and all
# of whose content already sits in ednet_sample_process.csv. Only regeneration
# needs it back -- EdNet-KT1.zip, 1.2 GB, from the same index. contents/ is kept
# because it is 174 KB and regeneration cannot start without it.
raw_path: data/ednet
dpath: data/ednet
configf: configs/data_config.json

min_seq_len: 3
maxlen: 200
kfold: 5
folds: [0,1,2,3,4]
emb_path: ""

train_valid_original_file: train_valid.csv
train_valid_file: train_valid_sequences.csv
test_original_file: test.csv
test_file: test_sequences.csv
test_window_file: test_window_sequences.csv

gen_question_level: true
test_question_file: test_question_sequences.csv
test_question_window_file: test_question_window_sequences.csv
train_valid_original_file_quelevel: train_valid_quelevel.csv
train_valid_file_quelevel: train_valid_sequences_quelevel.csv
test_file_quelevel: test_sequences_quelevel.csv
test_window_file_quelevel: test_window_sequences_quelevel.csv
test_original_file_quelevel: test_quelevel.csv
