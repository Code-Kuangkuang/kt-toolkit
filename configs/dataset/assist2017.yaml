dataset_name: assist2017
raw_path: data/assist2017/anonymized_full_release_competition_dataset.csv
dpath: data/assist2017
configf: configs/data_config.json

# true = pyKT's preprocessing: the raw action log, the widely cited 1,709
# students / 942,816 interactions protocol. This is the default, and the
# on-disk data matches it.
#
# This release is an ACTION log -- one row per attempt or help request, not per
# problem -- so it carries two leaks: scaffolding rows (original == 0, generated
# only after a wrong answer) and repeated attempts on the same problem, which
# run 0,0,...,1 until solved. Measured: within original == 1, first-attempt
# correctness is 0.448 but last-attempt is 0.599, and only 84.1% of attempt
# groups are label-constant.
#
# Set false to keep main problems only and collapse each attempt group to its
# first action (171,431 interactions, -81.8%, students unchanged at 1,709),
# matching the granularity of the assist2009 collapsed release. Correct data,
# but it breaks comparability with every paper citing 942,816, and the dataset
# must be regenerated.
keep_scaffolding: true

min_seq_len: 3
maxlen: 200
kfold: 5
folds: [0,1,2,3,4]
emb_path: ""

train_valid_original_file: train_valid.csv
train_valid_file: train_valid_sequences.csv
test_original_file: test.csv
test_file: test_sequences.csv
test_window_file: test_window_sequences.csv

gen_question_level: true
test_question_file: test_question_sequences.csv
test_question_window_file: test_question_window_sequences.csv
train_valid_original_file_quelevel: train_valid_quelevel.csv
train_valid_file_quelevel: train_valid_sequences_quelevel.csv
test_file_quelevel: test_sequences_quelevel.csv
test_window_file_quelevel: test_window_sequences_quelevel.csv
test_original_file_quelevel: test_quelevel.csv
