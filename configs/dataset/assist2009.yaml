dataset_name: assist2009
raw_path: data/assist2009/skill_builder_data_corrected_collapsed.csv
dpath: data/assist2009
configf: configs/data_config.json

# true = pyKT's preprocessing, which does not filter scaffolding. Every
# published number on this dataset is computed this way, so this is the default
# and the on-disk data (283,105 interactions / 4,163 students) matches it.
#
# The cost is real and measured: scaffolding sub-problems (original == 0) are
# generated only after a wrong answer on the main problem, so they carry the
# previous label -- 8.6x leakage (0.331 correct right after a wrong main problem
# vs 0.039 after a correct one). Xiong et al. EDM 2016 established that they
# should be dropped, and qDKT/GIKT/PEBG do.
#
# Set false to drop them: cleaner data (259,399 interactions, -8.4%), but the
# numbers stop being comparable to pyKT or the literature, and the dataset must
# be regenerated (scripts/run_clean.py) with the stale .pkl caches deleted.
keep_scaffolding: true


min_seq_len: 3
maxlen: 200
kfold: 5
folds: [0,1,2,3,4]
emb_path: ""

train_valid_original_file: train_valid.csv
train_valid_file: train_valid_sequences.csv
test_original_file: test.csv
test_file: test_sequences.csv
test_window_file: test_window_sequences.csv

gen_question_level: true
test_question_file: test_question_sequences.csv
test_question_window_file: test_question_window_sequences.csv
train_valid_original_file_quelevel: train_valid_quelevel.csv
train_valid_file_quelevel: train_valid_sequences_quelevel.csv
test_file_quelevel: test_sequences_quelevel.csv
test_window_file_quelevel: test_window_sequences_quelevel.csv
test_original_file_quelevel: test_quelevel.csv



