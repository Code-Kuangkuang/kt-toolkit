name: CPU contracts
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      WANDB_MODE: disabled
      KT_ALLOW_MISSING_TEST_DATA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-web.txt
      # Private datasets are intentionally absent from Git; local full pytest also
      # validates their inventory. Everything else must work without real data.
      - run: python -m pytest -q --ignore=tests/test_dataset_inventory.py
