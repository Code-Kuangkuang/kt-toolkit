[pytest]
# Collect only from tests/. Without this, pytest walks the whole repository
# root, which holds data/, saved_model/, wandb/ and research/ -- large trees
# with no tests in them, and some with files the process cannot read.
testpaths = tests

# The default .pytest_cache at the repository root is not writable in this
# checkout, which produces a PytestCacheWarning on every run. .cache/ is already
# where dataset pickles go and is gitignored.
cache_dir = .cache/pytest

# Run both styles. Five files use plain test_ functions rather than
# unittest.TestCase, so `python -m unittest` silently collects nothing from
# them; pytest collects both, which is why it is the supported runner.
python_files = test_*.py
python_classes = Test* *Test
python_functions = test_*

addopts = -q --strict-markers
